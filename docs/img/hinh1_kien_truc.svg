<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 660" width="1100" height="660" font-family="'Segoe UI', 'Helvetica Neue', Arial, 'DejaVu Sans', sans-serif">
  <defs>
    <marker id="ahData" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="2.6" markerHeight="2.6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0284C7"/>
    </marker>
    <marker id="ahCtl" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748B"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <linearGradient id="gTracker" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EEF2FF"/>
      <stop offset="1" stop-color="#E0E7FF"/>
    </linearGradient>
    <linearGradient id="gB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F0FDFA"/>
      <stop offset="1" stop-color="#CCFBF1"/>
    </linearGradient>
    <linearGradient id="gA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF7ED"/>
      <stop offset="1" stop-color="#FFEDD5"/>
    </linearGradient>
  </defs>

  <rect width="1100" height="660" fill="#FFFFFF"/>

  <!-- ===== Tracker ===== -->
  <rect x="290" y="30" width="520" height="230" rx="18" fill="url(#gTracker)" stroke="#6366F1" stroke-width="2" filter="url(#shadow)"/>
  <text x="315" y="68" font-size="24" font-weight="700" fill="#312E81">Tracker</text>
  <text x="315" y="92" font-size="13.5" fill="#4338CA">server điều phối · một luồng · poll() · socket non-blocking</text>
  <rect x="672" y="50" width="118" height="28" rx="14" fill="#4F46E5"/>
  <text x="731" y="69" font-size="13" font-weight="600" fill="#FFFFFF" text-anchor="middle">không lưu file</text>

  <g font-size="12" fill="#475569">
    <rect x="310" y="115" width="115" height="125" rx="12" fill="#FFFFFF" stroke="#C7D2FE" stroke-width="1.5"/>
    <circle cx="334" cy="140" r="11" fill="#E0E7FF"/>
    <text x="334" y="145" font-size="13" text-anchor="middle" fill="#4F46E5" font-weight="700">P</text>
    <text x="352" y="145" font-size="14.5" font-weight="700" fill="#1E1B4B">peers</text>
    <text x="322" y="176">ai đang online</text>
    <text x="322" y="194">username +</text>
    <text x="322" y="212">kết nối TCP</text>

    <rect x="435" y="115" width="115" height="125" rx="12" fill="#FFFFFF" stroke="#C7D2FE" stroke-width="1.5"/>
    <circle cx="459" cy="140" r="11" fill="#E0E7FF"/>
    <text x="459" y="145" font-size="13" text-anchor="middle" fill="#4F46E5" font-weight="700">C</text>
    <text x="477" y="145" font-size="14.5" font-weight="700" fill="#1E1B4B">catalog</text>
    <text x="447" y="176">(chủ, tên file)</text>
    <text x="447" y="194">→ dung lượng</text>
    <text x="447" y="212">LIST · SEARCH</text>

    <rect x="560" y="115" width="115" height="125" rx="12" fill="#FFFFFF" stroke="#C7D2FE" stroke-width="1.5"/>
    <circle cx="584" cy="140" r="11" fill="#E0E7FF"/>
    <text x="584" y="145" font-size="13" text-anchor="middle" fill="#4F46E5" font-weight="700">T</text>
    <text x="602" y="145" font-size="14.5" font-weight="700" fill="#1E1B4B">transfer</text>
    <text x="572" y="176">phiên đang mở</text>
    <text x="572" y="194">tid · nguồn · đích</text>
    <text x="572" y="212">K = 2 / nguồn</text>

    <rect x="685" y="115" width="105" height="125" rx="12" fill="#FFFFFF" stroke="#C7D2FE" stroke-width="1.5"/>
    <circle cx="709" cy="140" r="11" fill="#E0E7FF"/>
    <text x="709" y="145" font-size="13" text-anchor="middle" fill="#4F46E5" font-weight="700">R</text>
    <text x="727" y="145" font-size="14.5" font-weight="700" fill="#1E1B4B">relay</text>
    <text x="697" y="176">chuyển tiếp</text>
    <text x="697" y="194">nguyên frame,</text>
    <text x="697" y="212">giữ CRC gốc</text>
  </g>

  <!-- ===== Legend ===== -->
  <g font-size="13" fill="#334155">
    <rect x="845" y="40" width="225" height="92" rx="12" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="862" y="64" font-size="12" font-weight="700" fill="#64748B" letter-spacing="0.5">CHÚ THÍCH</text>
    <line x1="862" y1="88" x2="912" y2="88" stroke="#0284C7" stroke-width="7" stroke-linecap="round" marker-end="url(#ahData)"/>
    <text x="925" y="93">dữ liệu file (relay)</text>
    <line x1="862" y1="114" x2="912" y2="114" stroke="#64748B" stroke-width="2" marker-end="url(#ahCtl)"/>
    <text x="925" y="119">lệnh, điều khiển</text>
  </g>

  <!-- ===== Arrows: Peer B <-> Tracker ===== -->
  <line x1="330" y1="372" x2="330" y2="270" stroke="#0284C7" stroke-width="7" stroke-linecap="round" marker-end="url(#ahData)"/>
  <line x1="370" y1="266" x2="370" y2="368" stroke="#64748B" stroke-width="2" marker-end="url(#ahCtl)"/>
  <g font-size="12.5">
    <text x="318" y="304" text-anchor="end" fill="#0369A1" font-weight="700">CHUNK · DONE</text>
    <text x="318" y="322" text-anchor="end" fill="#475569">SHARE · UNSHARE</text>
    <text x="382" y="298" fill="#475569">SEND_REQ · ABORT</text>
    <text x="382" y="316" fill="#475569">ACK · NACK</text>
    <text x="382" y="334" fill="#475569">REQ_RANGE</text>
  </g>

  <!-- ===== Arrows: Tracker <-> Peer A ===== -->
  <line x1="730" y1="368" x2="730" y2="266" stroke="#64748B" stroke-width="2" marker-end="url(#ahCtl)"/>
  <line x1="770" y1="270" x2="770" y2="372" stroke="#0284C7" stroke-width="7" stroke-linecap="round" marker-end="url(#ahData)"/>
  <g font-size="12.5">
    <text x="718" y="298" text-anchor="end" fill="#475569">GET · LIST · SEARCH</text>
    <text x="718" y="316" text-anchor="end" fill="#475569">CANCEL · ACK · NACK</text>
    <text x="718" y="334" text-anchor="end" fill="#475569">REQ_RANGE</text>
    <text x="782" y="304" fill="#0369A1" font-weight="700">CHUNK · DONE</text>
    <text x="782" y="322" fill="#475569">GET_OK · SOURCE_GONE</text>
  </g>

  <!-- ===== Peer B ===== -->
  <rect x="40" y="385" width="390" height="185" rx="18" fill="url(#gB)" stroke="#14B8A6" stroke-width="2" filter="url(#shadow)"/>
  <text x="64" y="420" font-size="21" font-weight="700" fill="#134E4A">Peer B</text>
  <text x="146" y="420" font-size="14" fill="#0F766E">người chia sẻ (nguồn)</text>
  <g font-size="13.5" fill="#1F2937">
    <circle cx="70" cy="446" r="4" fill="#14B8A6"/>
    <text x="84" y="451">share, unshare: công bố và gỡ file</text>
    <circle cx="70" cy="472" r="4" fill="#14B8A6"/>
    <text x="84" y="477">đọc từng chunk 16 KB bằng pread()</text>
    <circle cx="70" cy="498" r="4" fill="#14B8A6"/>
    <text x="84" y="503">cửa sổ W = 8, chỉ gửi lại chunk bị xin</text>
  </g>
  <!-- disk -->
  <g transform="translate(64,520)">
    <ellipse cx="16" cy="6" rx="16" ry="5" fill="#99F6E4" stroke="#0D9488" stroke-width="1.5"/>
    <path d="M0,6 v20 a16,5 0 0 0 32,0 v-20" fill="#CCFBF1" stroke="#0D9488" stroke-width="1.5"/>
    <ellipse cx="16" cy="6" rx="16" ry="5" fill="#99F6E4" stroke="#0D9488" stroke-width="1.5"/>
    <text x="44" y="23" font-size="13" fill="#115E59">file gốc trên đĩa · SHA-256 tính dần khi gửi</text>
  </g>

  <!-- ===== Peer A ===== -->
  <rect x="670" y="385" width="390" height="185" rx="18" fill="url(#gA)" stroke="#F97316" stroke-width="2" filter="url(#shadow)"/>
  <text x="694" y="420" font-size="21" font-weight="700" fill="#7C2D12">Peer A</text>
  <text x="776" y="420" font-size="14" fill="#C2410C">người tải</text>
  <g font-size="13.5" fill="#1F2937">
    <circle cx="700" cy="446" r="4" fill="#F97316"/>
    <text x="714" y="451">list, search, get, cancel, tiến trình</text>
    <circle cx="700" cy="472" r="4" fill="#F97316"/>
    <text x="714" y="477">kiểm CRC32, ghi đúng vị trí bằng pwrite()</text>
    <circle cx="700" cy="498" r="4" fill="#F97316"/>
    <text x="714" y="503">ACK · NACK · REQ_RANGE · SHA-256</text>
  </g>
  <g transform="translate(694,520)">
    <ellipse cx="16" cy="6" rx="16" ry="5" fill="#FED7AA" stroke="#EA580C" stroke-width="1.5"/>
    <path d="M0,6 v20 a16,5 0 0 0 32,0 v-20" fill="#FFEDD5" stroke="#EA580C" stroke-width="1.5"/>
    <ellipse cx="16" cy="6" rx="16" ry="5" fill="#FED7AA" stroke="#EA580C" stroke-width="1.5"/>
    <text x="44" y="23" font-size="13" fill="#9A3412">download/tên.part → đổi tên khi xong</text>
  </g>

  <!-- ===== P2P (extension) ===== -->
  <line x1="442" y1="478" x2="658" y2="478" stroke="#A8A29E" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#ahCtl)" marker-start="url(#ahCtl)"/>
  <rect x="487" y="452" width="126" height="22" rx="11" fill="#FFFFFF" stroke="#D6D3D1"/>
  <text x="550" y="467" font-size="12" fill="#78716C" text-anchor="middle">P2P · mở rộng</text>

  <!-- ===== common/ ===== -->
  <rect x="40" y="598" width="1020" height="40" rx="12" fill="#F1F5F9" stroke="#CBD5E1"/>
  <text x="62" y="623" font-size="14" font-weight="700" fill="#0F172A" font-family="Consolas, 'DejaVu Sans Mono', monospace">common/</text>
  <text x="150" y="623" font-size="13.5" fill="#334155">protocol.h · frame · conn · netio · crc32 · sha256 · util — dùng chung cho Tracker, Peer và chương trình test</text>
</svg>
