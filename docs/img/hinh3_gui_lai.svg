<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 908" width="1100" height="908" font-family="'Segoe UI', 'Helvetica Neue', Arial, 'DejaVu Sans', sans-serif">
<defs>
<marker id="m_data" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0284C7"/></marker>
<marker id="m_resend" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16A34A"/></marker>
<marker id="m_ctl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker>
<marker id="m_req" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#EA580C"/></marker>
<marker id="m_err" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#DC2626"/></marker>
<marker id="m_ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16A34A"/></marker>
<filter id="sh" x="-10%" y="-20%" width="120%" height="150%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.10"/></filter>
</defs>
<rect width="1100" height="908" fill="#FFFFFF"/>
<text x="40" y="38" font-size="20" font-weight="700" fill="#0F172A">Phát hiện và gửi lại chunk lỗi</text>
<text x="40" y="60" font-size="13.5" fill="#64748B">Kịch bản kiểm thử thật: nguồn chạy với --fault-drop=3 --fault-corrupt=5 (chỉ tác động lần gửi đầu)</text>
<rect x="495" y="88" width="110" height="750" rx="10" fill="#EEF2FF" opacity="0.7"/>
<text x="550" y="110" font-size="13" font-weight="700" fill="#4338CA" text-anchor="middle">Tracker</text>
<text x="550" y="127" font-size="11.5" fill="#6366F1" text-anchor="middle">chỉ chuyển tiếp</text>
<rect x="170" y="88" width="160" height="50" rx="12" fill="#F0FDFA" stroke="#14B8A6" stroke-width="2" filter="url(#sh)"/>
<text x="250" y="111" font-size="16" font-weight="700" fill="#134E4A" text-anchor="middle">Peer B</text>
<text x="250" y="129" font-size="12" fill="#14B8A6" text-anchor="middle">nguồn</text>
<line x1="250" y1="140" x2="250" y2="833" stroke="#14B8A6" stroke-width="2" stroke-dasharray="2 5" stroke-linecap="round"/>
<rect x="770" y="88" width="160" height="50" rx="12" fill="#FFF7ED" stroke="#F97316" stroke-width="2" filter="url(#sh)"/>
<text x="850" y="111" font-size="16" font-weight="700" fill="#7C2D12" text-anchor="middle">Peer A</text>
<text x="850" y="129" font-size="12" fill="#F97316" text-anchor="middle">người tải</text>
<line x1="850" y1="140" x2="850" y2="833" stroke="#F97316" stroke-width="2" stroke-dasharray="2 5" stroke-linecap="round"/>
<line x1="250" y1="168" x2="844" y2="168" stroke="#0284C7" stroke-width="3" marker-end="url(#m_data)"/>
<text x="550.0" y="159" font-size="14" font-weight="600" fill="#0284C7" text-anchor="middle" letter-spacing="0.3">CHUNK 2</text>
<line x1="850" y1="218" x2="256" y2="218" stroke="#64748B" stroke-width="2" marker-end="url(#m_ctl)"/>
<text x="550.0" y="209" font-size="14" font-weight="600" fill="#64748B" text-anchor="middle" letter-spacing="0.3">ACK 2</text>
<line x1="250" y1="268" x2="590" y2="268" stroke="#DC2626" stroke-width="3" stroke-dasharray="8 5"/>
<circle cx="602" cy="268" r="12" fill="#FEE2E2" stroke="#DC2626" stroke-width="2"/>
<path d="M597,263 L607,273 M607,263 L597,273" stroke="#DC2626" stroke-width="2.5" stroke-linecap="round"/>
<text x="622" y="273" font-size="12.5" fill="#DC2626" font-style="italic">bị bỏ (--fault-drop)</text>
<text x="400.0" y="259" font-size="14" font-weight="700" fill="#DC2626" text-anchor="middle" letter-spacing="0.3">CHUNK 3</text>
<line x1="250" y1="318" x2="844" y2="318" stroke="#0284C7" stroke-width="3" marker-end="url(#m_data)"/>
<text x="550.0" y="309" font-size="14" font-weight="600" fill="#0284C7" text-anchor="middle" letter-spacing="0.3">CHUNK 4</text>
<rect x="862" y="302" width="196" height="42" rx="8" fill="#FFFBEB" stroke="#FCD34D"/>
<text x="874" y="320" font-size="12.5" fill="#78350F">đang chờ 3 mà nhận 4</text>
<text x="874" y="336" font-size="12.5" fill="#78350F">→ chunk 3 bị bỏ sót</text>
<line x1="850" y1="368" x2="256" y2="368" stroke="#EA580C" stroke-width="2" marker-end="url(#m_req)"/>
<text x="550.0" y="359" font-size="14" font-weight="700" fill="#EA580C" text-anchor="middle" letter-spacing="0.3">REQ_RANGE 3–3</text>
<line x1="250" y1="418" x2="844" y2="418" stroke="#DC2626" stroke-width="3" marker-end="url(#m_err)"/>
<path d="M316,418 l5,-9 l6,16 l6,-16 l6,16 l5,-7" fill="none" stroke="#DC2626" stroke-width="2.2" stroke-linejoin="round"/>
<text x="480.0" y="409" font-size="14" font-weight="700" fill="#DC2626" text-anchor="middle" letter-spacing="0.3">CHUNK 5</text>
<text x="635.0" y="409" font-size="12.5" fill="#DC2626" font-style="italic" text-anchor="middle">bị hỏng (--fault-corrupt)</text>
<rect x="862" y="402" width="196" height="42" rx="8" fill="#FFFBEB" stroke="#FCD34D"/>
<text x="874" y="420" font-size="12.5" fill="#78350F">CRC32 không khớp</text>
<text x="874" y="436" font-size="12.5" fill="#78350F">→ không ghi, xin lại</text>
<line x1="850" y1="468" x2="256" y2="468" stroke="#EA580C" stroke-width="2" marker-end="url(#m_req)"/>
<text x="550.0" y="459" font-size="14" font-weight="700" fill="#EA580C" text-anchor="middle" letter-spacing="0.3">NACK 5</text>
<line x1="250" y1="518" x2="844" y2="518" stroke="#16A34A" stroke-width="3" marker-end="url(#m_resend)"/>
<text x="550.0" y="509" font-size="14" font-weight="700" fill="#16A34A" text-anchor="middle" letter-spacing="0.3">CHUNK 3  (gửi lại)</text>
<rect x="42" y="502" width="196" height="42" rx="8" fill="#FFFBEB" stroke="#FCD34D"/>
<text x="54" y="520" font-size="12.5" fill="#78350F">đọc lại đúng chunk 3</text>
<text x="54" y="536" font-size="12.5" fill="#78350F">từ đĩa bằng pread()</text>
<line x1="250" y1="568" x2="844" y2="568" stroke="#16A34A" stroke-width="3" marker-end="url(#m_resend)"/>
<text x="550.0" y="559" font-size="14" font-weight="700" fill="#16A34A" text-anchor="middle" letter-spacing="0.3">CHUNK 5  (gửi lại)</text>
<line x1="850" y1="618" x2="256" y2="618" stroke="#64748B" stroke-width="2" marker-end="url(#m_ctl)"/>
<text x="550.0" y="609" font-size="14" font-weight="600" fill="#64748B" text-anchor="middle" letter-spacing="0.3">ACK 3 · ACK 4 · ACK 5</text>
<line x1="250" y1="668" x2="850" y2="668" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="3 6"/>
<rect x="305" y="655" width="490" height="26" rx="13" fill="#FFFFFF" stroke="#E2E8F0"/>
<text x="550" y="673" font-size="13" fill="#64748B" text-anchor="middle">chunk 6 … 122: gửi theo cửa sổ W = 8, mỗi ACK mở thêm một chỗ</text>
<line x1="250" y1="718" x2="844" y2="718" stroke="#0284C7" stroke-width="3" marker-end="url(#m_data)"/>
<text x="550.0" y="709" font-size="14" font-weight="600" fill="#0284C7" text-anchor="middle" letter-spacing="0.3">DONE (SHA-256 cả file)</text>
<rect x="862" y="702" width="196" height="42" rx="8" fill="#FFFBEB" stroke="#FCD34D"/>
<text x="874" y="720" font-size="12.5" fill="#78350F">đủ 123 chunk, SHA-256</text>
<text x="874" y="736" font-size="12.5" fill="#78350F">khớp → đổi tên .part</text>
<line x1="850" y1="768" x2="256" y2="768" stroke="#16A34A" stroke-width="2" marker-end="url(#m_ok)"/>
<text x="550.0" y="759" font-size="14" font-weight="700" fill="#16A34A" text-anchor="middle" letter-spacing="0.3">OK</text>
<rect x="42" y="752" width="196" height="42" rx="8" fill="#FFFBEB" stroke="#FCD34D"/>
<text x="54" y="770" font-size="12.5" fill="#78350F">phiên kết thúc,</text>
<text x="54" y="786" font-size="12.5" fill="#78350F">Tracker đóng phiên</text>
<rect x="250" y="840" width="600" height="36" rx="18" fill="#F0FDF4" stroke="#86EFAC"/>
<text x="550" y="864" font-size="14" font-weight="700" fill="#166534" text-anchor="middle">Chỉ gửi lại đúng 2 chunk × 16 KB, không gửi lại cả file</text>
</svg>