<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 882" width="1100" height="882" font-family="'Segoe UI', 'Helvetica Neue', Arial, 'DejaVu Sans', sans-serif">
<defs>
<marker id="m_data" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0284C7"/></marker>
<marker id="m_ctl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker>
<marker id="m_open" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7C3AED"/></marker>
<marker id="m_ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16A34A"/></marker>
<marker id="m_stop" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#DC2626"/></marker>
<filter id="sh" x="-10%" y="-20%" width="120%" height="150%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.10"/></filter>
</defs>
<rect width="1100" height="882" fill="#FFFFFF"/>
<text x="40" y="38" font-size="20" font-weight="700" fill="#0F172A">Một phiên tải file qua relay</text>
<text x="40" y="60" font-size="13.5" fill="#64748B">alice (Peer A) tải phim.mkv của bob (Peer B); mọi frame của phiên mang cùng transfer_id</text>
<rect x="135" y="88" width="170" height="52" rx="12" fill="#F0FDFA" stroke="#14B8A6" stroke-width="2" filter="url(#sh)"/>
<text x="220" y="112" font-size="16" font-weight="700" fill="#134E4A" text-anchor="middle">Peer B</text>
<text x="220" y="130" font-size="12" fill="#14B8A6" text-anchor="middle">bob · nguồn</text>
<line x1="220" y1="142" x2="220" y2="858" stroke="#14B8A6" stroke-width="2" stroke-dasharray="2 5" stroke-linecap="round"/>
<rect x="465" y="88" width="170" height="52" rx="12" fill="#EEF2FF" stroke="#6366F1" stroke-width="2" filter="url(#sh)"/>
<text x="550" y="112" font-size="16" font-weight="700" fill="#312E81" text-anchor="middle">Tracker</text>
<text x="550" y="130" font-size="12" fill="#6366F1" text-anchor="middle">điều phối · relay</text>
<line x1="550" y1="142" x2="550" y2="858" stroke="#6366F1" stroke-width="2" stroke-dasharray="2 5" stroke-linecap="round"/>
<rect x="795" y="88" width="170" height="52" rx="12" fill="#FFF7ED" stroke="#F97316" stroke-width="2" filter="url(#sh)"/>
<text x="880" y="112" font-size="16" font-weight="700" fill="#7C2D12" text-anchor="middle">Peer A</text>
<text x="880" y="130" font-size="12" fill="#F97316" text-anchor="middle">alice · người tải</text>
<line x1="880" y1="142" x2="880" y2="858" stroke="#F97316" stroke-width="2" stroke-dasharray="2 5" stroke-linecap="round"/>
<line x1="880" y1="172" x2="556" y2="172" stroke="#64748B" stroke-width="2" marker-end="url(#m_ctl)"/>
<text x="715.0" y="163" font-size="13.5" font-weight="700" fill="#64748B" text-anchor="middle">GET (bob, phim.mkv)</text>
<rect x="365" y="199.0" width="370" height="50" rx="10" fill="#EEF2FF" stroke="#A5B4FC"/>
<text x="550" y="222.0" font-size="12.5" fill="#3730A3" text-anchor="middle">kiểm tra: A đã JOIN · không phải file của A</text>
<text x="550" y="240.0" font-size="12.5" fill="#3730A3" text-anchor="middle">bob online · có trong catalog · bob &lt; K = 2 phiên</text>
<line x1="550" y1="276" x2="226" y2="276" stroke="#7C3AED" stroke-width="2" marker-end="url(#m_open)"/>
<text x="385.0" y="267" font-size="13.5" font-weight="700" fill="#7C3AED" text-anchor="middle">SEND_REQ  tid = 7</text>
<line x1="550" y1="328" x2="874" y2="328" stroke="#7C3AED" stroke-width="2" marker-end="url(#m_open)"/>
<text x="715.0" y="319" font-size="13.5" font-weight="700" fill="#7C3AED" text-anchor="middle">GET_OK  tid = 7, dung lượng, N chunk</text>
<rect x="894" y="314" width="175" height="42" rx="8" fill="#FFFBEB" stroke="#FCD34D"/>
<text x="905" y="331" font-size="12.5" fill="#78350F">tạo download/</text>
<text x="905" y="347" font-size="12.5" fill="#78350F">phim.mkv.part</text>
<line x1="220" y1="380" x2="874" y2="380" stroke="#0284C7" stroke-width="3" marker-end="url(#m_data)"/>
<circle cx="550" cy="380" r="5" fill="#FFFFFF" stroke="#6366F1" stroke-width="2"/>
<text x="385.0" y="371" font-size="13.5" font-weight="700" fill="#0284C7" text-anchor="middle">CHUNK 0 … 7  (cửa sổ W = 8)</text>
<rect x="894" y="366" width="175" height="42" rx="8" fill="#FFFBEB" stroke="#FCD34D"/>
<text x="905" y="383" font-size="12.5" fill="#78350F">kiểm CRC32, ghi</text>
<text x="905" y="399" font-size="12.5" fill="#78350F">đúng vị trí, ACK</text>
<line x1="880" y1="432" x2="226" y2="432" stroke="#64748B" stroke-width="2" marker-end="url(#m_ctl)"/>
<circle cx="550" cy="432" r="5" fill="#FFFFFF" stroke="#6366F1" stroke-width="2"/>
<text x="715.0" y="423" font-size="13.5" font-weight="700" fill="#64748B" text-anchor="middle">ACK i</text>
<rect x="31" y="418" width="175" height="42" rx="8" fill="#FFFBEB" stroke="#FCD34D"/>
<text x="42" y="435" font-size="12.5" fill="#78350F">mỗi ACK mở thêm</text>
<text x="42" y="451" font-size="12.5" fill="#78350F">một chỗ trong cửa sổ</text>
<line x1="220" y1="484" x2="880" y2="484" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="3 6"/>
<rect x="400" y="471" width="300" height="26" rx="13" fill="#FFFFFF" stroke="#E2E8F0"/>
<text x="550" y="489" font-size="13" fill="#64748B" text-anchor="middle">lặp lại cho tới chunk N − 1</text>
<line x1="220" y1="536" x2="874" y2="536" stroke="#0284C7" stroke-width="3" marker-end="url(#m_data)"/>
<circle cx="550" cy="536" r="5" fill="#FFFFFF" stroke="#6366F1" stroke-width="2"/>
<text x="385.0" y="527" font-size="13.5" font-weight="700" fill="#0284C7" text-anchor="middle">DONE  (SHA-256 cả file)</text>
<rect x="894" y="522" width="175" height="42" rx="8" fill="#FFFBEB" stroke="#FCD34D"/>
<text x="905" y="539" font-size="12.5" fill="#78350F">đủ chunk, SHA-256 khớp</text>
<text x="905" y="555" font-size="12.5" fill="#78350F">→ đổi tên .part</text>
<line x1="880" y1="588" x2="226" y2="588" stroke="#16A34A" stroke-width="2" marker-end="url(#m_ok)"/>
<circle cx="550" cy="588" r="5" fill="#FFFFFF" stroke="#6366F1" stroke-width="2"/>
<text x="715.0" y="579" font-size="13.5" font-weight="700" fill="#16A34A" text-anchor="middle">OK  tid = 7</text>
<rect x="365" y="624.0" width="370" height="32" rx="10" fill="#EEF2FF" stroke="#A5B4FC"/>
<text x="550" y="647.0" font-size="12.5" fill="#3730A3" text-anchor="middle">đóng phiên, không giữ lại bản sao nào</text>
<rect x="40" y="698" width="1020" height="134" rx="10" fill="#FEF2F2" fill-opacity="0.45" stroke="#FCA5A5" stroke-dasharray="6 4"/>
<path d="M40,708 a10,10 0 0 1 10,-10 h190 v18 l-12,12 h-188 z" fill="#FEE2E2" stroke="#FCA5A5"/>
<text x="54" y="718" font-size="12.5" font-weight="700" fill="#B91C1C">Nếu alice huỷ giữa chừng</text>
<line x1="880" y1="748" x2="556" y2="748" stroke="#DC2626" stroke-width="2" marker-end="url(#m_stop)"/>
<text x="715.0" y="739" font-size="13.5" font-weight="700" fill="#DC2626" text-anchor="middle">CANCEL  tid = 7</text>
<rect x="894" y="734" width="175" height="26" rx="8" fill="#FFFBEB" stroke="#FCD34D"/>
<text x="905" y="751" font-size="12.5" fill="#78350F">xoá .part</text>
<line x1="550" y1="800" x2="226" y2="800" stroke="#DC2626" stroke-width="2" marker-end="url(#m_stop)"/>
<text x="385.0" y="791" font-size="13.5" font-weight="700" fill="#DC2626" text-anchor="middle">ABORT  tid = 7</text>
<rect x="31" y="786" width="175" height="42" rx="8" fill="#FFFBEB" stroke="#FCD34D"/>
<text x="42" y="803" font-size="12.5" fill="#78350F">dừng gửi,</text>
<text x="42" y="819" font-size="12.5" fill="#78350F">đóng file</text>
</svg>