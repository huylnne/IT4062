<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 420" width="1100" height="420" font-family="'Segoe UI', 'Helvetica Neue', Arial, 'DejaVu Sans', sans-serif">
  <defs>
    <pattern id="stripes" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="10" height="10" fill="#F8FAFC"/>
      <line x1="0" y1="0" x2="0" y2="10" stroke="#E2E8F0" stroke-width="4"/>
    </pattern>
  </defs>
  <rect width="1100" height="420" fill="#FFFFFF"/>

  <text x="40" y="38" font-size="20" font-weight="700" fill="#0F172A">Frame = header 22 byte + payload</text>
  <text x="40" y="60" font-size="13.5" fill="#64748B">Ví dụ: frame CHUNK số 3 của phiên 7, payload 16 384 byte (giá trị hex, network byte order)</text>

  <!-- group labels + brackets -->
  <g font-size="13.5" font-weight="700" text-anchor="middle">
    <text x="86" y="92" fill="#4338CA">magic</text>
    <text x="155" y="92" fill="#475569" font-size="12">ver</text>
    <text x="201" y="92" fill="#7C3AED" font-size="12">type</text>
    <text x="247" y="92" fill="#475569" font-size="12">flags</text>
    <text x="293" y="92" fill="#475569" font-size="12">rsv</text>
    <text x="408" y="92" fill="#0F766E">transfer_id</text>
    <text x="592" y="92" fill="#0369A1">chunk_id</text>
    <text x="776" y="92" fill="#B45309">length</text>
    <text x="960" y="92" fill="#BE123C">crc32</text>
  </g>
  <g fill="none" stroke-width="1.5">
    <path d="M42,104 v-5 h88 v5" stroke="#6366F1"/>
    <path d="M318,104 v-5 h180 v5" stroke="#14B8A6"/>
    <path d="M502,104 v-5 h180 v5" stroke="#0EA5E9"/>
    <path d="M686,104 v-5 h180 v5" stroke="#F59E0B"/>
    <path d="M870,104 v-5 h180 v5" stroke="#F43F5E"/>
  </g>

  <!-- byte cells -->
  <g font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="15" font-weight="700" text-anchor="middle">
    <!-- magic -->
    <rect x="40" y="108" width="46" height="46" fill="#EEF2FF" stroke="#6366F1" stroke-width="1.5"/>
    <rect x="86" y="108" width="46" height="46" fill="#EEF2FF" stroke="#6366F1" stroke-width="1.5"/>
    <text x="63" y="137" fill="#312E81">F5</text><text x="109" y="137" fill="#312E81">A1</text>
    <!-- version, type, flags, reserved -->
    <rect x="132" y="108" width="46" height="46" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="178" y="108" width="46" height="46" fill="#F5F3FF" stroke="#8B5CF6" stroke-width="1.5"/>
    <rect x="224" y="108" width="46" height="46" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="270" y="108" width="46" height="46" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
    <text x="155" y="137" fill="#334155">01</text><text x="201" y="137" fill="#5B21B6">30</text>
    <text x="247" y="137" fill="#334155">00</text><text x="293" y="137" fill="#334155">00</text>
    <!-- transfer_id -->
    <g fill="#F0FDFA" stroke="#14B8A6" stroke-width="1.5">
      <rect x="316" y="108" width="46" height="46"/><rect x="362" y="108" width="46" height="46"/>
      <rect x="408" y="108" width="46" height="46"/><rect x="454" y="108" width="46" height="46"/>
    </g>
    <g fill="#115E59"><text x="339" y="137">00</text><text x="385" y="137">00</text><text x="431" y="137">00</text><text x="477" y="137">07</text></g>
    <!-- chunk_id -->
    <g fill="#F0F9FF" stroke="#0EA5E9" stroke-width="1.5">
      <rect x="500" y="108" width="46" height="46"/><rect x="546" y="108" width="46" height="46"/>
      <rect x="592" y="108" width="46" height="46"/><rect x="638" y="108" width="46" height="46"/>
    </g>
    <g fill="#075985"><text x="523" y="137">00</text><text x="569" y="137">00</text><text x="615" y="137">00</text><text x="661" y="137">03</text></g>
    <!-- length -->
    <g fill="#FFFBEB" stroke="#F59E0B" stroke-width="1.5">
      <rect x="684" y="108" width="46" height="46"/><rect x="730" y="108" width="46" height="46"/>
      <rect x="776" y="108" width="46" height="46"/><rect x="822" y="108" width="46" height="46"/>
    </g>
    <g fill="#92400E"><text x="707" y="137">00</text><text x="753" y="137">00</text><text x="799" y="137">40</text><text x="845" y="137">00</text></g>
    <!-- crc32 -->
    <g fill="#FFF1F2" stroke="#F43F5E" stroke-width="1.5">
      <rect x="868" y="108" width="46" height="46"/><rect x="914" y="108" width="46" height="46"/>
      <rect x="960" y="108" width="46" height="46"/><rect x="1006" y="108" width="46" height="46"/>
    </g>
    <g fill="#9F1239"><text x="891" y="137">9A</text><text x="937" y="137">1C</text><text x="983" y="137">2E</text><text x="1029" y="137">4B</text></g>
  </g>

  <!-- offsets -->
  <g font-size="11" fill="#94A3B8" text-anchor="middle" font-family="Consolas, 'DejaVu Sans Mono', monospace">
    <text x="63" y="171">0</text><text x="109" y="171">1</text><text x="155" y="171">2</text><text x="201" y="171">3</text>
    <text x="247" y="171">4</text><text x="293" y="171">5</text><text x="339" y="171">6</text><text x="385" y="171">7</text>
    <text x="431" y="171">8</text><text x="477" y="171">9</text><text x="523" y="171">10</text><text x="569" y="171">11</text>
    <text x="615" y="171">12</text><text x="661" y="171">13</text><text x="707" y="171">14</text><text x="753" y="171">15</text>
    <text x="799" y="171">16</text><text x="845" y="171">17</text><text x="891" y="171">18</text><text x="937" y="171">19</text>
    <text x="983" y="171">20</text><text x="1029" y="171">21</text>
  </g>

  <!-- descriptions -->
  <g font-size="12.5" fill="#475569" text-anchor="middle">
    <text x="86" y="200">luôn 0xF5A1</text>
    <text x="86" y="218">sai → dữ liệu</text>
    <text x="86" y="236">lệch hoặc rác</text>

    <text x="224" y="200">version = 1</text>
    <text x="224" y="218">type 0x30 = CHUNK</text>
    <text x="224" y="236">flags bit 0: frame cuối</text>
    <text x="224" y="254">reserved = 0</text>

    <text x="408" y="200">mã phiên truyền</text>
    <text x="408" y="218">0 = lệnh không</text>
    <text x="408" y="236">thuộc phiên nào</text>

    <text x="592" y="200">số thứ tự chunk</text>
    <text x="592" y="218">REQ_RANGE: chunk đầu,</text>
    <text x="592" y="236">chunk cuối ở payload</text>

    <text x="776" y="200">0x4000 = 16 384</text>
    <text x="776" y="218">tối đa 64 KB, lớn hơn</text>
    <text x="776" y="236">→ ERR rồi đóng</text>

    <text x="960" y="200">CRC32 của payload</text>
    <text x="960" y="218">bên nhận tính lại,</text>
    <text x="960" y="236">khác → NACK</text>
  </g>

  <!-- payload -->
  <path d="M776,262 v22" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="4 3"/>
  <path d="M40,292 v-8 h1020 v8" fill="none" stroke="#F59E0B" stroke-width="1.5"/>
  <rect x="694" y="272" width="164" height="22" rx="11" fill="#FFFBEB" stroke="#F59E0B"/>
  <text x="776" y="288" font-size="12.5" font-weight="700" fill="#B45309" text-anchor="middle">length = 16 384 byte</text>
  <rect x="40" y="300" width="1020" height="58" rx="10" fill="url(#stripes)" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="62" y="325" font-size="15" font-weight="700" fill="#0F172A">payload</text>
  <text x="62" y="346" font-size="13" fill="#475569">với CHUNK: dữ liệu thô của chunk, ghi thẳng vào frame, không đổi sang base64 · với lệnh: chuỗi (1 byte độ dài + nội dung), số u16/u32/u64</text>

  <text x="40" y="392" font-size="12.5" fill="#64748B">Số nhiều byte theo network byte order (big-endian) · bên nhận đọc đủ 22 byte header, xem length rồi đọc đúng chừng đó byte payload</text>
</svg>
